services:


  # backend: FastAPI + OMRExams code + system dependencies
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omrexams-backend
    ports:
      - "5000:5000"
    volumes:
      # The data/ folder on the user's machine is mounted
      # inside the container, therefore the generated files (exams, scans, results)
      # they persist even after the containers are restarted
      - ./data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    restart: unless-stopped
    networks:
      - omrexams-network


  # frontend: React compiled by Vite, served by nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omrexams-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - omrexams-network


# internal network between containers

# The two containers communicate with each other via this virtual network.
# Within it, the frontend can reach the backend
# using the service name as the hostname: http://backend:5000
# This name should be used in nginx.conf for the proxy, NOT localhost.
networks:
  omrexams-network:
    driver: bridge
