server {
    listen 80;
    server_name localhost;

    # ============================================================
    # FILE STATICI — React compilato da Vite
    # ============================================================
    # Nginx serve i file statici compilati da Vite (HTML, CSS, JS)
    # dalla cartella in cui il Dockerfile li ha copiati
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # ROUTING LATO CLIENT — React Router
    # ============================================================
    # React Router gestisce la navigazione interamente nel browser.
    # Senza questa direttiva, se l'utente visita direttamente un URL
    # come http://localhost:8080/generate, nginx cercherebbe un file
    # fisico chiamato "generate" sul disco e restituirebbe 404.
    # Con "try_files" diciamo a nginx: se il file non esiste fisicamente,
    # servi sempre index.html e lascia che sia React Router a decidere
    # cosa mostrare in base all'URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # PROXY VERSO IL BACKEND — chiamate API
    # ============================================================
    # Tutte le richieste che iniziano con /api/ vengono inoltrate
    # dal frontend al backend FastAPI.
    # "backend" è il nome del servizio definito in docker-compose.yaml:
    # all'interno della rete Docker, questo nome funziona come hostname.
    # NON usare localhost qui — si riferirebbe al container nginx stesso.
    location /api/ {
        proxy_pass http://backend:5000;

        # Intestazioni necessarie per far funzionare correttamente il proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # PROXY PER SERVER-SENT EVENTS (SSE) — progress bar
    # ============================================================
    # Gli endpoint SSE (usati per le progress bar di generazione
    # e correzione) richiedono una configurazione speciale:
    # nginx di default bufferizza le risposte, il che impedirebbe
    # al frontend di ricevere gli aggiornamenti in tempo reale.
    # Disabilitare il buffering su questi endpoint risolve il problema.
    location /api/generate/progress {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disabilita il buffering per SSE
        proxy_buffering off;
        proxy_cache off;

        # Mantieni la connessione aperta (necessario per SSE)
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/correct/progress {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ============================================================
    # UPLOAD DI FILE GRANDI — scansioni PDF
    # ============================================================
    # Il limite di default di nginx per il corpo delle richieste
    # è 1MB, troppo poco per i PDF delle scansioni.
    # Impostiamo un limite generoso per gli endpoint di upload.
    location /api/scan/upload {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Aumenta il limite per file grandi (PDF di scansioni)
        client_max_body_size 500M;

        # Timeout più lungo per upload pesanti
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}